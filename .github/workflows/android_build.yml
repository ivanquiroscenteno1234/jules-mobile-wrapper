name: Build and Upload Android APK

on:
  push:
    branches:
      - '**' # Trigger on all branches for testing
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Upload to Drive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Temporary Build Project
        run: |
          # Create a clean flutter project with a specific organization to avoid default com.example
          flutter create --org com.jules temp_build

          # Remove default code and android folder
          rm -rf temp_build/lib temp_build/pubspec.yaml temp_build/android

          # Copy user code
          cp -r mobile_jules/client/lib temp_build/
          cp mobile_jules/client/pubspec.yaml temp_build/
          
          # Copy Android folder with core library desugaring enabled
          cp -r mobile_jules/client/android temp_build/

      - name: Install Dependencies
        working-directory: ./temp_build
        run: flutter pub get

      - name: Build APK
        working-directory: ./temp_build
        run: flutter build apk --release

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth

      - name: Upload to Google Drive (OAuth)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python scripts/upload_with_oauth.py

  repair:
    name: Jules Repair Build
    needs: build
    # Only runs if the 'build' job fails
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for Jules to create PRs with fixes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Invoke Jules to Fix Flutter Build
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            The Flutter Android build failed in the 'build' job. 
            Context:
            - We are using a temporary build project approach.
            - Path: mobile_jules/client/
            - Error occurred during 'flutter build apk' or 'flutter pub get'.
            
            Please:
            1. Look at the repository files and the build logs.
            2. Identify if it's a dependency conflict (pubspec.yaml) or a Gradle/Java 17 incompatibility.
            3. Propose a fix or create a PR with the corrected configuration.
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
