name: Build and Upload Android APK

on:
  push:
    branches:
      - '**' # Trigger on all branches for testing
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Upload to Drive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Temporary Build Project
        run: |
          # Create a clean flutter project with a specific organization to avoid default com.example
          flutter create --org com.jules temp_build

          # Remove default code and android folder
          rm -rf temp_build/lib temp_build/pubspec.yaml temp_build/android

          # Copy user code
          cp -r mobile_jules/client/lib temp_build/
          cp mobile_jules/client/pubspec.yaml temp_build/
          
          # Copy Android folder with core library desugaring enabled
          cp -r mobile_jules/client/android temp_build/

      - name: Install Dependencies
        working-directory: ./temp_build
        run: flutter pub get

      - name: Build APK
        working-directory: ./temp_build
        run: flutter build apk --release

      - name: Install Python Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth

      - name: Upload to Google Drive (OAuth)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python scripts/upload_with_oauth.py

  repair:
    name: Jules Repair Build
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for Jules to create PRs with fixes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Invoke Jules via API
        run: |
          curl -X POST "https://jules.googleapis.com/v1alpha/sessions" \
          -H "Content-Type: application/json" \
          -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
          -d @- <<EOF
          {
            "prompt": "The Flutter Android build failed in GitHub Actions. Please analyze the repository and fix the error.\n\n# Instructions for Jules (AI Agent)\n\n## Project Structure\n- This is a **Flutter monorepo**.\n- The mobile app source code is located in: mobile_jules/client/\n- We use a custom CI/CD process that creates a temp_build directory for APK generation.\n\n## Build & Environment\n- **Java Version:** Java 11 (configured in android/app/build.gradle.kts)\n  - Note: CI workflow uses Zulu 17 for compatibility, but the app itself targets Java 11\n- **Flutter Channel:** Stable\n- **Install Command:** Run flutter pub get inside the mobile_jules/client/ directory\n- **Build Command:** flutter build apk --release (executed from temp_build path in CI)\n- **Build Failure Focus Areas:** If the build fails, investigate:\n  - /mobile_jules/client/pubspec.yaml (dependency conflicts)\n  - /mobile_jules/client/android/app/build.gradle.kts (Gradle/Java compatibility)\n\n## Coding Standards & Preferences\n- Follow official Flutter/Dart linting rules\n- Maintain existing architecture patterns in the lib/ folder\n- Use **Core Library Desugaring** for Android compatibility (already enabled in build.gradle.kts)\n- If a build error mentions Core Library Desugaring, check android/app/build.gradle.kts\n- Ensure all Google Drive integration scripts remain intact in /scripts/\n\n## Task Execution Guidelines\n- **Critical:** Apply fixes to source files in mobile_jules/client/, NOT just the temp_build folder\n- Always run flutter pub get locally to verify dependency resolutions before proposing a PR\n- When creating a PR, reference the specific build failure or issue that triggered your investigation",
            "sourceContext": {
              "source": "sources/github/${{ github.repository }}",
              "githubRepoContext": {
                "startingBranch": "${{ github.ref_name }}"
              }
            },
            "title": "Fix Build Failure on ${{ github.ref_name }}"
          }
          EOF
